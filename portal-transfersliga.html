<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Konten Transfers Liga</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;600&display=swap");
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0a0a;--card:#151515;--tx:#f5f5f5;--mu:#9a9a9a;--bd:#2a2a2a;--l1:#F2FF00;--l2:#38bdf8;--ac:#F2FF00;--acx:#0a0a0a;--hd:"Barlow Condensed","Arial Narrow Bold",Impact,sans-serif}
:root[data-theme="light"],:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#151515;--tx:#f5f5f5}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 400px at 80% -10%,#26290055,transparent),var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif}
.w{max-width:980px;margin:0 auto;padding:14px}
h1,h2{font-family:var(--hd);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:22px;margin:0}h2{font-size:20px;margin:20px 0 8px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}a{color:var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx);background:#1d1d1d;border:1px solid var(--bd);border-radius:10px;padding:7px 12px}
button{cursor:pointer;font-weight:600}button:hover{border-color:var(--ac)}button.p,button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.logo{height:40px;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}.tabs button{font-family:var(--hd);font-style:italic;font-size:16px;text-transform:uppercase;white-space:nowrap}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid currentColor}
.t1{color:var(--l1)}.t2{color:var(--l2)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{min-height:64px;border:1px solid var(--bd);border-radius:10px;padding:4px;background:var(--card);cursor:pointer;font-size:11px;text-align:left}
.day.sel{outline:2px solid var(--ac)}.day b{display:block}.dow{font-size:11px;color:var(--mu);text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details{border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;margin:6px 0;background:var(--card)}
details.a2{border-left-color:var(--l2)}
summary{padding:10px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
.bd{padding:0 12px 12px}.bd h4{margin:12px 0 3px;font-family:var(--hd);font-style:italic;font-size:14px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.bd p,.bd li{margin:2px 0}.bd ul{padding-left:0;list-style:none;margin:0}
.done{opacity:.55}.bars{display:flex;align-items:flex-end;gap:4px;height:70px}.bars i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.cols{grid-template-columns:1fr}}
.center{max-width:420px;margin:8vh auto;text-align:center}.center .logo{height:auto;width:240px;margin:0 auto 14px}
.who{display:block;width:100%;margin:8px 0;padding:14px;font-family:var(--hd);font-style:italic;font-size:22px;text-transform:uppercase;text-align:left}
.who small{display:block;font-family:Inter,sans-serif;font-style:normal;font-size:12px;color:var(--mu);text-transform:none;font-weight:400}
.who:hover{background:var(--ac);color:var(--acx)}.who:hover small{color:var(--acx)}
.hot{border-color:var(--ac)}

const PIL={news:'News',klasemen:'Klasemen',fulltime:'Fulltime',reels:'Video'};
const S={fx:[],tk:{},news:[],perf:[],me:null,tab:'cal',sel:null,month:null,filter:'all'};
let db,user,sample,uid,isOwner=false;
function h(t,p,...k){const e=document.createElement(t);for(const a in(p||{})){if(a==='class')e.className=p[a];else if(a.startsWith('on'))e.addEventListener(a.slice(2),p[a]);else if(a==='value')e.value=p[a];else e.setAttribute(a,p[a])}k.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c))});return e}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const idDate=s=>new Date(s+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const addH=(t,n)=>{const[a,b]=t.split(':').map(Number);const m=a*60+b+n*60;return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
const nextDay=s=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+1);return ymd(d)};

function genPlan(){
  const out=[],load={};
  const pick=(acct,date,pref)=>{const base=pref||(acct==1?'william':'alwind');const k=base+date;
    const who=(load[k]||0)>=3?'raden':base;load[who+date]=(load[who+date]||0)+1;return who};
  const days={};S.fx.forEach(f=>{(days[f.league+'|'+f.date]=days[f.league+'|'+f.date]||[]).push(f)});
  const dates=new Set(S.fx.map(f=>f.date));
  S.fx.forEach(f=>out.push({id:'ft-'+f.id,type:'fulltime',acct:f.league,date:f.date,time:addH(f.time,2),title:`Fulltime ${name(f.home)} vs ${name(f.away)}`,fx:f,who:pick(f.league,f.date)}));
  Object.entries(days).forEach(([k,list])=>{const[lg,date]=k.split('|');const last=list.map(x=>x.time).sort().pop();const first=list[0];
    out.push({id:`rl-${lg}-${date}`,type:'reels',acct:+lg,date,time:addH(last,3),title:`Reels highlight matchday ${idDate(date).split(',')[0]}`,fx:first,list,who:'indra'});
    out.push({id:`kl-${lg}-${date}`,type:'klasemen',acct:+lg,date:nextDay(date),time:'09:00',title:`Update klasemen setelah ${date}`,list,who:pick(+lg,nextDay(date))})});
  S.news.forEach(n=>out.push({id:'nn-'+n.id,type:'news',acct:n.league,date:n.date,time:n.time||'12:00',title:n.title,news:n,who:n.league==1?'william':'alwind'}));
  return out.map(t=>{const o=S.tk[t.id]||{};return{...t,who:o.who||t.who,status:o.status||'todo',brief:o.brief,chk:o.chk||[]}})
   .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
const CODE=a=>a==1?'BRI_SUPER_LEAGUE_2026-27':'PEGADAIAN_CHAMPIONSHIP_2026-27';
const REF=t=>[{t:'Jadwal & hasil resmi I.League',u:'https://ileague.id/fixtures/index/'+CODE(t.acct)},{t:'Klasemen resmi I.League',u:'https://ileague.id/table/index/'+CODE(t.acct)},{t:'Inspirasi layout: IG I.League',u:'https://www.instagram.com/ileague.id'},{t:'Inspirasi layout: IG Transfermarkt',u:'https://www.instagram.com/transfermarkt_official'}];

  const n=t.news;return{...base,Tujuan:n?'Menyajikan berita transfer/klub yang sedang hangat.':'Slot berita rutin: pilih berita terbaik hari ini.',Visual:'Cover headline besar + foto pemain/klub resmi, label "BREAKING/TRANSFER". 4:5.',Caption:n?`${n.title}. Setuju nggak? Komen di bawah 👇${n.source?'\nSumber: '+n.source:''}`:'[Isi dari tab Berita]',Hashtag:'#TransferNews',Referensi:REF(t),Checklist:['Verifikasi di minimal 2 sumber','Tulis headline ≤ 12 kata','Cantumkan sumber','Cek hak cipta foto','Kirim ke Owner']};
}
async function saveTk(t,patch){const o={who:t.who,status:t.status,brief:t.brief||null,chk:t.chk||[],...patch};
  S.tk[t.id]=o;try{await db.collection('tasks').doc(t.id).set(o)}catch(e){alert('Gagal simpan: '+(e.message||e))}render()}
// ---------- UI ----------
function briefView(t){const lb=localBrief(t);const b={Platform:lb.Platform,Deadline:lb.Deadline,...t.brief};const box=h('div',{class:'bd'});
  if(t.news&&t.news.url&&String(t.news.url).startsWith('https://'))b.Referensi=[{t:'Berita sumber: '+(t.news.source||'buka'),u:t.news.url},...(b.Referensi||[])];
  const refs=(b.Referensi||lb.Referensi||[]);
  Object.entries(b).forEach(([k,v])=>{if(k==='Checklist'||k==='Referensi')return;box.append(h('h4',{},k),h('p',{style:'white-space:pre-line'},v))});
  box.append(h('h4',{},'Referensi'),h('ul',{},refs.filter(r=>String(r.u).startsWith('https://')).map(r=>h('li',{},h('a',{href:r.u,target:'_blank',rel:'noopener'},'↗ '+r.t)))));
  box.append(h('h4',{},'Checklist'),h('ul',{},(b.Checklist||lb.Checklist||[]).map((c,i)=>h('li',{},h('label',{},h('input',{type:'checkbox',...(t.chk[i]?{checked:''}:{}),onchange:e=>{const a=[...t.chk];a[i]=e.target.checked;saveTk(t,{chk:a})}}),' '+c)))));
  const r=h('div',{class:'row',style:'margin-top:12px'});
  r.append(h('select',{onchange:e=>saveTk(t,{status:e.target.value})},['todo','progress','review','done'].map(s=>h('option',{value:s,...(t.status==s?{selected:''}:{})},s))));
  if(isOwner)r.append(h('select',{onchange:e=>saveTk(t,{who:e.target.value})},Object.entries(PEOPLE).map(([k,v])=>h('option',{value:k,...(t.who==k?{selected:''}:{})},v))));
  box.append(r);return box}
function taskItem(t){const d=h('details',{class:(t.status=='done'?'done ':'')+'a'+t.acct});
  d.append(h('summary',{},h('span',{class:'tag t'+t.acct},ACC[t.acct]),h('b',{},PIL[t.type]),h('span',{},t.title),h('span',{class:'mu'},`${t.date} ${t.time} · ${PEOPLE[t.who].split(' ')[0]} · ${t.status}`)));
  d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('.bd'))d.append(briefView(t))});return d}
function myTasks(all){const r=S.me.role;return all.filter(t=>S.filter=='all'||(S.filter=='mine'?(t.who==r):true))}

function viewCal(){const all=genPlan();const m=S.month||(S.fx[0]?new Date(S.fx[0].date+'T00:00:00'):new Date());
  const y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate();
  const el=h('div',{});
  el.append(h('div',{class:'row'},h('button',{onclick:()=>{S.month=new Date(y,mo-1,1);render()}},'‹'),h('b',{},first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})),h('button',{onclick:()=>{S.month=new Date(y,mo+1,1);render()}},'›'),h('span',{class:'mu'},'● hijau = Super League, biru = Championship')));
  const g=h('div',{class:'grid',style:'margin-top:8px'});['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(x=>g.append(h('div',{class:'dow'},x)));
  for(let i=0;i<(first.getDay()+6)%7;i++)g.append(h('div'));
  for(let d=1;d<=n;d++){const k=y+'-'+pad(mo+1)+'-'+pad(d);const f1=S.fx.filter(f=>f.date==k&&f.league==1).length,f2=S.fx.filter(f=>f.date==k&&f.league==2).length,tn=all.filter(t=>t.date==k&&t.status!='done').length;
    g.append(h('button',{class:'day'+(S.sel==k?' sel':''),onclick:()=>{S.sel=k;render()}},h('b',{},d),f1?h('span',{class:'t1'},'⚽ '+f1):'',f1?' ':'',f2?h('span',{class:'t2'},'⚽ '+f2):'',tn?h('div',{class:'mu'},tn+' tugas'):''))}
  el.append(g);
  if(S.sel){el.append(h('h2',{},idDate(S.sel)));const fx=S.fx.filter(f=>f.date==S.sel);
    el.append(fx.length?fx.map(f=>h('div',{class:'card'},h('span',{class:'tag t'+f.league},f.league==1?'Super League':'Championship'),` ${f.time} WIB — `,h('b',{},f.home+' vs '+f.away),h('div',{class:'mu'},f.venue))):h('p',{class:'mu'},'Tidak ada pertandingan.'));
    el.append(h('h2',{},'Tugas konten hari ini'),all.filter(t=>t.date==S.sel).map(taskItem))}
  return el}
function viewPlan(){const all=myTasks(genPlan());const el=h('div',{});
  el.append(h('div',{class:'row'},[['all','Semua'],['mine','Tugas saya']].map(([k,l])=>h('button',{class:S.filter==k?'p':'',onclick:()=>{S.filter=k;render()}},l))),
   h('p',{class:'mu'},'Berita masuk otomatis dari Claude, sudah di-plot ke tiap orang. Fulltime = kickoff + 2 jam, Video highlight = Indra, Klasemen = pagi H+1. William pegang L1, Alwind L2, Raden fleksibel di dua akun. Klik item untuk brief + referensi.'));
  const byDate={};all.forEach(t=>(byDate[t.date]=byDate[t.date]||[]).push(t));
  Object.keys(byDate).sort().forEach(d=>el.append(h('h2',{},idDate(d)),byDate[d].map(taskItem)));
  if(!all.length)el.append(h('p',{class:'mu'},'Belum ada tugas.'));return el}
function viewNews(){const el=h('div',{});const all=genPlan().filter(t=>t.news);
  el.append(h('p',{class:'mu'},'Berita dipilih & di-brief otomatis oleh Claude. Kamu tinggal buka tugas sesuai namamu.'));
  const mine=all.filter(t=>t.who==S.me.role),rest=all.filter(t=>t.who!=S.me.role);
  if(mine.length)el.append(h('h2',{},'Tugas berita kamu'),mine.map(taskItem));
  if(rest.length)el.append(h('h2',{},'Tim lain'),rest.map(taskItem));
  if(!all.length)el.append(h('p',{class:'mu'},'Belum ada berita baru.'));return el}
function viewPerf(){const el=h('div',{});const f={};
  const num=(k,ph)=>{f[k]=h('input',{type:'number',placeholder:ph,style:'width:110px'});return f[k]};
  f.a=h('select',{},h('option',{value:1},ACC[1]),h('option',{value:2},ACC[2]));f.d=h('input',{type:'date',value:ymd(new Date())});
  el.append(h('div',{class:'card'},h('b',{},'Update performa (angka yang terlihat publik di profil)'),h('div',{class:'row',style:'margin-top:8px'},f.a,f.d,num('f','Followers'),num('r','Rata2 views reels'),num('i','Rata2 like+komen/post'),num('p','Jumlah post'),h('button',{class:'p',onclick:async()=>{if(!f.f.value)return;await db.collection('perf').doc(Date.now().toString(36)).set({acct:+f.a.value,date:f.d.value,followers:+f.f.value,reach:+f.r.value||0,inter:+f.i.value||0,posts:+f.p.value||0})}},'Simpan')),
   h('p',{class:'mu'},'Instagram memblokir pengambilan data akun dari luar, jadi cukup isi 4 angka yang kelihatan di profil tiap minggu (30 detik). Untuk reach/impressions otomatis, perlu sambung Meta Graph API (lihat chat).')));
  const cols=h('div',{class:'cols'});
  [1,2].forEach(a=>{const r=S.perf.filter(x=>x.acct==a).sort((x,y)=>x.date.localeCompare(y.date));const l=r[r.length-1],p=r[r.length-2];const c=h('div',{class:'card'},h('b',{class:'t'+a},ACC[a]));
    if(!l)c.append(h('p',{class:'mu'},'Belum ada data.'));else{const dl=(k)=>p?(l[k]-p[k]>=0?'+':'')+(l[k]-p[k]).toLocaleString('id-ID'):'–';
      c.append(h('p',{},`Followers ${l.followers.toLocaleString('id-ID')} (${dl('followers')})`),h('p',{},`Rata2 views ${l.reach.toLocaleString('id-ID')} (${dl('reach')})`),h('p',{},`Rata2 interaksi ${l.inter.toLocaleString('id-ID')} · Engagement ${l.followers?(l.inter/l.followers*100).toFixed(2):'0'}% · ${l.posts} post`));
      const mx=Math.max(...r.map(x=>x.reach),1);c.append(h('div',{class:'mu'},'Rata2 views per minggu'),h('div',{class:'bars'},r.slice(-10).map(x=>h('i',{style:`height:${x.reach/mx*100}%`,title:x.date+': '+x.reach}))))}
    cols.append(c)});el.append(cols);return el}
function login(msg){$.replaceChildren(h('div',{class:'center card'},h('img',{class:'logo',src:LOGO,alt:'TL Group'}),h('h1',{},'Content Portal'),h('p',{class:'mu'},msg),
  ...(user?[S.last?h('button',{class:'p who',onclick:()=>{S.me={role:S.last};render()}},'Lanjut sebagai '+PEOPLE[S.last]):'',h('p',{},'Masuk sebagai siapa?'),...Object.keys(PEOPLE).map(k=>h('button',{class:'who',onclick:async()=>{await db.collection('team').doc(uid).set({role:k});S.me={role:k};render()}},PEOPLE[k],h('small',{},ROLE[k])))]:[])))}
function render(){if(!S.me)return;const tabs=[['cal','Kalender'],['plan','Content Plan'],['news','Berita Hari Ini'],['perf','Performa']];
  const v={cal:viewCal,plan:viewPlan,news:viewNews,perf:viewPerf}[S.tab]();
  $.replaceChildren(h('div',{class:'top'},h('img',{class:'logo',src:LOGO,alt:'TL Group'}),h('span',{class:'mu'},PEOPLE[S.me.role]+' · ',h('a',{href:'#',onclick:async e=>{e.preventDefault();S.me=null;login('Pilih nama kamu.')}},'ganti'))),
   h('div',{class:'tabs'},tabs.map(([k,l])=>h('button',{class:S.tab==k?'on':'',onclick:()=>{S.tab=k;render()}},l))),v)}
(async()=>{
  login('Memuat…');
  const T=p=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),8000))]);

})();
